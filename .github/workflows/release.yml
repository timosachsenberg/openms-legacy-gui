name: Release

# Publish the three portable packages for a v* tag.
#
# Builds are not duplicated here. This workflow calls the same Linux/macOS and
# Windows pipelines used on packaging pull requests, so a release cannot drift
# onto an untested build path.
#
# A manual dispatch builds and verifies every package without publishing. This
# makes it safe to rehearse the complete pipeline before creating a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unix:
    uses: ./.github/workflows/unix-portable.yml

  windows:
    uses: ./.github/workflows/windows-portable.yml

  publish:
    name: Publish draft release
    needs: [unix, windows]
    runs-on: ubuntu-latest
    # Manual dispatch is a non-publishing rehearsal; only a v* tag can publish.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          # Matrix and Windows jobs upload into separate artifact directories.
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          find artifacts -type f -name '*.sha256' -exec cat {} + | \
            sort > release/SHA256SUMS.txt

          mapfile -t packages < <(find release -maxdepth 1 -type f -name '*.zip' -print | sort)
          if (( ${#packages[@]} != 3 )); then
            echo "ERROR: expected Linux, macOS, and Windows packages; found ${#packages[@]}." >&2
            printf '  %s\n' "${packages[@]}" >&2
            exit 1
          fi
          if [[ ! -s release/SHA256SUMS.txt ]]; then
            echo 'ERROR: no checksums were collected.' >&2
            exit 1
          fi

          (cd release && sha256sum -c SHA256SUMS.txt)

          # Catch archives that accidentally contain only the application and
          # depend on a Qt installation from the build runner.
          status=0
          for package in "${packages[@]}"; do
            listing=$(unzip -l "$package")
            case "$listing" in
              *Qt6Core*|*QtCore.framework*) ;;
              *)
                echo "ERROR: $(basename "$package") contains no Qt runtime." >&2
                status=1
                ;;
            esac
          done
          (( status == 0 ))

          ls -lh release
          cat release/SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
